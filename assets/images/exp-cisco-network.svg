<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="netGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#netBg)"/>
  <rect width="800" height="500" fill="url(#netGrid)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Packet Tracer Workspace Simulation Frame -->
  <g transform="translate(45, 45)">
    <rect width="710" height="410" rx="10" fill="#121212" stroke="#333" stroke-width="1"/>
    
    <!-- App Header Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 700 0 Q 710 0 710 10 L 710 38 L 0 38 Z" fill="#1c1c1c"/>
    <circle cx="20" cy="19" r="5" fill="#444"/>
    <circle cx="38" cy="19" r="5" fill="#444"/>
    <circle cx="56" cy="19" r="5" fill="#444"/>
    <text x="85" y="23" fill="#a3a3a3" font-family="'JetBrains Mono', monospace" font-size="12">
      Cisco Packet Tracer — NTI Enterprise Multi-VLAN Network (Router-on-a-Stick)
    </text>
    <rect x="580" y="9" width="115" height="20" rx="4" fill="#262626"/>
    <text x="637" y="23" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">802.1Q ACTIVE</text>

    <!-- ==============================================================
         1. CORE ROUTER (R1) AREA
         ============================================================== -->
    <!-- Router Icon & Circle -->
    <g transform="translate(355, 68)">
      <circle cx="0" cy="0" r="24" fill="#181818" stroke="#ffffff" stroke-width="2"/>
      <!-- Router dual-direction routing arrows -->
      <path d="M -12 -6 L 12 -6 M 12 -6 L 6 -11 M 12 -6 L 6 -1" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 12 6 L -12 6 M -12 6 L -6 1 M -12 6 L -6 11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Router Title (Cleanly below the icon) -->
    <text x="355" y="106" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" font-weight="800">
      CORE ROUTER (R1)
    </text>

    <!-- Sub-interfaces Pill Badge (Generous spacing, no line collision) -->
    <g transform="translate(355, 124)">
      <rect x="-195" y="-10" width="390" height="22" rx="11" fill="#1a1a1a" stroke="#383838" stroke-width="1"/>
      <text x="0" y="4" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="500">
        Sub-interfaces: Fa0/0.10 • Fa0/0.20 • Fa0/0.30 (802.1Q)
      </text>
    </g>

    <!-- ==============================================================
         2. 802.1Q TRUNK LINK (Between Router and Switch)
         ============================================================== -->
    <!-- Clean dashed trunk line -->
    <line x1="355" y1="135" x2="355" y2="200" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,4"/>

    <!-- Trunk Badge (Opaque background masks the line cleanly in the center) -->
    <g transform="translate(355, 168)">
      <rect x="-65" y="-11" width="130" height="22" rx="4" fill="#0d0d0d" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="4" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="700" letter-spacing="0.5">
        802.1Q TRUNK
      </text>
    </g>

    <!-- ==============================================================
         3. DISTRIBUTION SWITCH (SW1)
         ============================================================== -->
    <g transform="translate(355, 218)">
      <rect x="-85" y="-18" width="170" height="36" rx="6" fill="#1c1c1c" stroke="#666" stroke-width="1.5"/>
      <text x="0" y="4" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11.5" text-anchor="middle" font-weight="700">
        DISTRIBUTION SW1
      </text>
      <!-- Switch Port Indicators (monochrome dots) -->
      <circle cx="-65" cy="10" r="2" fill="#888"/>
      <circle cx="-55" cy="10" r="2" fill="#888"/>
      <circle cx="-45" cy="10" r="2" fill="#888"/>
      <circle cx="45" cy="10" r="2" fill="#888"/>
      <circle cx="55" cy="10" r="2" fill="#888"/>
      <circle cx="65" cy="10" r="2" fill="#888"/>
    </g>

    <!-- ==============================================================
         4. BRANCHING ACCESS LINKS TO 3 SECTIONS
         ============================================================== -->
    <!-- Line to Section 1 -->
    <path d="M 295 236 L 140 275" stroke="#777" stroke-width="1.8"/>
    <rect x="180" y="244" width="38" height="15" rx="3" fill="#121212" stroke="#333"/>
    <text x="199" y="255" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Fa0/1</text>

    <!-- Line to Section 2 -->
    <path d="M 355 236 L 355 275" stroke="#777" stroke-width="1.8"/>
    <rect x="360" y="248" width="38" height="15" rx="3" fill="#121212" stroke="#333"/>
    <text x="379" y="259" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Fa0/2</text>

    <!-- Line to Section 3 -->
    <path d="M 415 236 L 570 275" stroke="#777" stroke-width="1.8"/>
    <rect x="495" y="244" width="38" height="15" rx="3" fill="#121212" stroke="#333"/>
    <text x="514" y="255" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Fa0/3</text>

    <!-- ==============================================================
         5. THE THREE SEGMENTED SECTIONS (VLAN 10, 20, 30)
         ============================================================== -->
    <!-- Section 1: VLAN 10 -->
    <g transform="translate(40, 275)">
      <rect width="200" height="115" rx="8" fill="#161616" stroke="#333" stroke-width="1"/>
      <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 28 L 0 28 Z" fill="#222"/>
      <text x="14" y="19" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">SECTION 1: VLAN 10</text>
      
      <text x="14" y="47" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9.5">Subnet: 192.168.10.0/24</text>
      <text x="14" y="64" fill="#71717a" font-family="sans-serif" font-size="10">Switch: SW-Dept-A</text>
      
      <!-- End Devices -->
      <g transform="translate(14, 76)">
        <rect x="0" y="0" width="46" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="23" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PC-1</text>

        <rect x="56" y="0" width="46" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="79" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PC-2</text>

        <rect x="112" y="0" width="56" height="26" rx="4" fill="#242424" stroke="#ffffff"/>
        <text x="140" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="700">SERVER</text>
      </g>
    </g>

    <!-- Section 2: VLAN 20 -->
    <g transform="translate(255, 275)">
      <rect width="200" height="115" rx="8" fill="#161616" stroke="#333" stroke-width="1"/>
      <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 28 L 0 28 Z" fill="#222"/>
      <text x="14" y="19" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">SECTION 2: VLAN 20</text>
      
      <text x="14" y="47" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9.5">Subnet: 192.168.20.0/24</text>
      <text x="14" y="64" fill="#71717a" font-family="sans-serif" font-size="10">Switch: SW-Dept-B</text>
      
      <!-- End Devices -->
      <g transform="translate(14, 76)">
        <rect x="0" y="0" width="46" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="23" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PC-3</text>

        <rect x="56" y="0" width="46" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="79" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PC-4</text>

        <rect x="112" y="0" width="56" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="140" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">AP-WIFI</text>
      </g>
    </g>

    <!-- Section 3: VLAN 30 -->
    <g transform="translate(470, 275)">
      <rect width="200" height="115" rx="8" fill="#161616" stroke="#333" stroke-width="1"/>
      <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 28 L 0 28 Z" fill="#222"/>
      <text x="14" y="19" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">SECTION 3: VLAN 30</text>
      
      <text x="14" y="47" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9.5">Subnet: 192.168.30.0/24</text>
      <text x="14" y="64" fill="#71717a" font-family="sans-serif" font-size="10">Switch: SW-Dept-C</text>
      
      <!-- End Devices -->
      <g transform="translate(14, 76)">
        <rect x="0" y="0" width="46" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="23" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PC-5</text>

        <rect x="56" y="0" width="46" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="79" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PC-6</text>

        <rect x="112" y="0" width="56" height="26" rx="4" fill="#242424" stroke="#444"/>
        <text x="140" y="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" font-weight="600">PRINTER</text>
      </g>
    </g>
  </g>
</svg>
