<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#gridPattern)"/>

  <!-- Subtle Vignette Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Header Bar / App Simulation -->
  <g transform="translate(40, 45)">
    <rect width="720" height="44" rx="8" fill="#171717" stroke="#333333" stroke-width="1"/>
    <circle cx="25" cy="22" r="5" fill="#404040"/>
    <circle cx="45" cy="22" r="5" fill="#404040"/>
    <circle cx="65" cy="22" r="5" fill="#404040"/>
    <text x="95" y="26" fill="#a3a3a3" font-family="'JetBrains Mono', monospace, Consolas" font-size="13" letter-spacing="1">
      AI_ESCAPE_ROOM // BREADTH_FIRST_SEARCH_ENGINE.py
    </text>
    <rect x="620" y="12" width="80" height="20" rx="4" fill="#262626"/>
    <text x="635" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">AI AGENT</text>
  </g>

  <!-- Maze & Search Visualization Area -->
  <g transform="translate(60, 115)">
    <!-- Maze Environment Grid -->
    <rect width="380" height="320" rx="12" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Grid Cells / Maze Obstacles -->
    <g opacity="0.85">
      <!-- Row 0 -->
      <rect x="20" y="20" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="70" y="20" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="120" y="20" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="170" y="20" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="220" y="20" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="270" y="20" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="320" y="20" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>

      <!-- Row 1 -->
      <rect x="20" y="70" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="70" y="70" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="120" y="70" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="170" y="70" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="220" y="70" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="270" y="70" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="320" y="70" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>

      <!-- Row 2 -->
      <rect x="20" y="120" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="70" y="120" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="120" y="120" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="170" y="120" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="220" y="120" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="270" y="120" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="320" y="120" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/>

      <!-- Row 3 -->
      <rect x="20" y="170" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="70" y="170" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="120" y="170" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/> <!-- Wall -->
      <rect x="170" y="170" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="220" y="170" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="270" y="170" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/>
      <rect x="320" y="170" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>

      <!-- Row 4 -->
      <rect x="20" y="220" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="70" y="220" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="120" y="220" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="170" y="220" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="220" y="220" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/>
      <rect x="270" y="220" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="320" y="220" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>

      <!-- Row 5 (Exit row) -->
      <rect x="20" y="270" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="70" y="270" width="40" height="40" rx="4" fill="#2e2e2e" stroke="#555"/>
      <rect x="120" y="270" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="170" y="270" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="220" y="270" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="270" y="270" width="40" height="40" rx="4" fill="#1c1c1c" stroke="#333"/>
      <rect x="320" y="270" width="40" height="40" rx="4" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/> <!-- EXIT -->
    </g>

    <!-- Shortest Path Computed by BFS -->
    <path d="M 40 40 L 90 40 L 90 140 L 40 140 L 40 240 L 90 240 L 140 240 L 140 290 L 240 290 L 290 290 L 340 290" 
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>

    <!-- Start Node (Agent) -->
    <circle cx="40" cy="40" r="14" fill="#ffffff" filter="url(#subtleGlow)"/>
    <polygon points="36,33 46,40 36,47" fill="#000000"/>

    <!-- Exit Target -->
    <circle cx="340" cy="290" r="14" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="333" y="295" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13">E</text>
  </g>

  <!-- Algorithm & OOP Metrics Card -->
  <g transform="translate(470, 115)">
    <!-- Right Dashboard Container -->
    <rect width="270" height="320" rx="12" fill="#111111" stroke="#292929" stroke-width="1"/>

    <!-- Code Header -->
    <text x="24" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">
      BFS Search Engine
    </text>
    <text x="24" y="58" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="11">
      Pathfinding & OOP Architecture
    </text>

    <!-- Separator -->
    <line x1="24" y1="72" x2="246" y2="72" stroke="#262626" stroke-width="1"/>

    <!-- Code Snapshot Box -->
    <g transform="translate(20, 85)">
      <rect width="230" height="110" rx="6" fill="#0a0a0a" stroke="#222"/>
      <text x="12" y="22" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">
        <tspan fill="#ffffff" font-weight="bold">def</tspan> <tspan fill="#e5e5e5">bfs_escape_path</tspan>(start, exit):
      </text>
      <text x="24" y="40" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="10.5">
        queue = deque([(start, [start])])
      </text>
      <text x="24" y="56" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="10.5">
        visited = set([start])
      </text>
      <text x="24" y="72" fill="#737373" font-family="'JetBrains Mono', monospace" font-size="10.5">
        <tspan fill="#ffffff">while</tspan> queue:
      </text>
      <text x="36" y="88" fill="#a3a3a3" font-family="'JetBrains Mono', monospace" font-size="10">
        curr, path = queue.popleft()
      </text>
    </g>

    <!-- Key Metrics Tags -->
    <g transform="translate(20, 215)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="105" height="38" rx="6" fill="#171717" stroke="#333"/>
      <text x="10" y="16" fill="#737373" font-family="sans-serif" font-size="10">EXPLORATION</text>
      <text x="10" y="32" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">OPTIMAL</text>

      <!-- Metric 2 -->
      <rect x="120" y="0" width="110" height="38" rx="6" fill="#171717" stroke="#333"/>
      <text x="130" y="16" fill="#737373" font-family="sans-serif" font-size="10">STRUCTURE</text>
      <text x="130" y="32" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">PYTHON OOP</text>
    </g>

    <!-- Bottom Feature Tag -->
    <g transform="translate(20, 268)">
      <rect width="230" height="34" rx="6" fill="#1f1f1f" stroke="#404040"/>
      <circle cx="20" cy="17" r="4" fill="#ffffff"/>
      <text x="32" y="21" fill="#e5e5e5" font-family="sans-serif" font-size="11" font-weight="600">
        Team Coordinator & AI Logic
      </text>
    </g>
  </g>
</svg>
