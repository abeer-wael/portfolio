<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pizzaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <pattern id="pizzaGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#222" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#pizzaBg)"/>
  <rect width="800" height="500" fill="url(#pizzaGrid)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(45, 45)">
    <rect width="710" height="410" rx="10" fill="#121212" stroke="#333" stroke-width="1"/>
    
    <!-- Browser Top Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 700 0 Q 710 0 710 10 L 710 40 L 0 40 Z" fill="#1c1c1c"/>
    <circle cx="20" cy="20" r="5" fill="#444"/>
    <circle cx="38" cy="20" r="5" fill="#444"/>
    <circle cx="56" cy="20" r="5" fill="#444"/>
    
    <!-- URL Bar -->
    <rect x="100" y="10" width="450" height="22" rx="4" fill="#0d0d0d" stroke="#2b2b2b"/>
    <text x="115" y="25" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="11">
      https://restaurant-pizza.app/index.html — [5 Pages: Home, Menu, About, Contact, Order]
    </text>

    <!-- Nav Simulation inside website -->
    <g transform="translate(30, 60)">
      <text x="0" y="22" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="1">
        ARTISAN PIZZA
      </text>

      <!-- 5 Navigation Links (Home, Menu, About, Contact, Order) -->
      <g transform="translate(240, 10)">
        <text x="0" y="10" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Home</text>
        <circle cx="15" cy="18" r="2" fill="#ffffff"/>
        
        <text x="60" y="10" fill="#888888" font-family="sans-serif" font-size="11">Menu</text>
        <text x="120" y="10" fill="#888888" font-family="sans-serif" font-size="11">About</text>
        <text x="180" y="10" fill="#888888" font-family="sans-serif" font-size="11">Contact</text>
        
        <!-- Order CTA -->
        <rect x="250" y="-8" width="80" height="26" rx="13" fill="#ffffff"/>
        <text x="272" y="9" fill="#000000" font-family="sans-serif" font-size="10.5" font-weight="700">Order</text>
      </g>
    </g>

    <line x1="30" y1="105" x2="680" y2="105" stroke="#222" stroke-width="1"/>

    <!-- Hero Content: Text Left + Interactive Rotating Pizza Right -->
    <g transform="translate(50, 140)">
      <!-- Left Column: Copy & Order Form UI -->
      <rect x="0" y="0" width="100" height="20" rx="3" fill="#222"/>
      <text x="10" y="14" fill="#a3a3a3" font-family="sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">FRESH CRAFTED</text>
      
      <text x="0" y="55" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
        Authentic Italian Taste
      </text>
      <text x="0" y="85" fill="#888888" font-family="sans-serif" font-size="13">
        Engineered with interactive JavaScript UI features &amp; dynamic form validation.
      </text>

      <!-- Mini Order Form Simulation -->
      <g transform="translate(0, 115)">
        <rect width="280" height="115" rx="8" fill="#161616" stroke="#2b2b2b"/>
        <text x="15" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Quick Order Builder</text>
        
        <!-- Select size -->
        <rect x="15" y="36" width="120" height="26" rx="4" fill="#0d0d0d" stroke="#333"/>
        <text x="25" y="53" fill="#888" font-family="sans-serif" font-size="10">Size: Large (14")</text>

        <!-- Select crust -->
        <rect x="145" y="36" width="120" height="26" rx="4" fill="#0d0d0d" stroke="#333"/>
        <text x="155" y="53" fill="#888" font-family="sans-serif" font-size="10">Crust: Thin Crispy</text>

        <!-- Button -->
        <rect x="15" y="72" width="250" height="30" rx="4" fill="#292929" stroke="#444"/>
        <text x="95" y="91" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Add to Order</text>
      </g>
    </g>

    <!-- Right Column: Interactive Animated Pizza Rotation Feature -->
    <g transform="translate(490, 240)">
      <!-- Rotation dashed orbit -->
      <circle cx="0" cy="0" r="125" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="6,4"/>
      <circle cx="0" cy="0" r="140" fill="none" stroke="#1f1f1f" stroke-width="1"/>
      
      <!-- Pizza Crust Base (Monochrome aesthetic) -->
      <circle cx="0" cy="0" r="105" fill="#242424" stroke="#4a4a4a" stroke-width="4"/>
      <circle cx="0" cy="0" r="92" fill="#191919" stroke="#333333" stroke-width="2"/>

      <!-- Pizza Slices Slices / Details -->
      <line x1="0" y1="-90" x2="0" y2="90" stroke="#2b2b2b" stroke-width="2"/>
      <line x1="-90" y1="0" x2="90" y2="0" stroke="#2b2b2b" stroke-width="2"/>
      <line x1="-64" y1="-64" x2="64" y2="64" stroke="#2b2b2b" stroke-width="2"/>
      <line x1="-64" y1="64" x2="64" y2="-64" stroke="#2b2b2b" stroke-width="2"/>

      <!-- Topping Elements (Monochrome dots & rings) -->
      <circle cx="-35" cy="-40" r="12" fill="#ffffff" fill-opacity="0.9"/>
      <circle cx="45" cy="-30" r="14" fill="#e0e0e0" fill-opacity="0.85"/>
      <circle cx="-40" cy="35" r="13" fill="#ffffff" fill-opacity="0.9"/>
      <circle cx="35" cy="40" r="12" fill="#cccccc" fill-opacity="0.85"/>
      <circle cx="0" cy="-5" r="10" fill="#ffffff" fill-opacity="0.95"/>
      
      <!-- Herbs / sprinkles -->
      <circle cx="-15" cy="-25" r="3" fill="#888"/>
      <circle cx="20" cy="-15" r="3" fill="#888"/>
      <circle cx="-15" cy="20" r="3" fill="#888"/>
      <circle cx="25" cy="15" r="3" fill="#888"/>

      <!-- Interactive JavaScript Rotation Indicator badge -->
      <g transform="translate(0, 115)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#0d0d0d" stroke="#ffffff" stroke-width="1"/>
        <text x="0" y="4" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="600">
          JS ROTATE: 360° INTERACTIVE
        </text>
      </g>
    </g>
  </g>
</svg>
